AWSTemplateFormatVersion: '2010-09-09'
Description: Anonymus - EC2 y MySQL privado para AWS Academy Learner Lab

Parameters:
  StudentCidr:
    Type: String
    Description: Tu IPv4 publica seguida de /32. Permite SSH solo desde tu conexion.
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: vockey
  InstanceProfile:
    Type: String
    Default: LabInstanceProfile
    AllowedValues: [LabInstanceProfile]
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  DatabasePassword:
    Type: String
    NoEcho: true
    MinLength: 20
    MaxLength: 64
    AllowedPattern: '[A-Za-z0-9]+'
    Description: Clave aleatoria de 20 a 64 letras y numeros. Guardala en tu gestor de claves.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: anonymus-lab}]
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Gateway
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Gateway
  PublicRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRoutes
  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH desde la conexion del estudiante; API mediante tunel
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref StudentCidr
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MySQL solo desde el servidor Anonymus
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref ServerSecurityGroup
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subredes privadas en dos zonas para RDS
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: mysql
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      StorageType: gp2
      StorageEncrypted: true
      DBName: tecnoshop
      MasterUsername: anonymusadmin
      MasterUserPassword: !Ref DatabasePassword
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      MonitoringInterval: 0
      EnablePerformanceInsights: false
      BackupRetentionPeriod: 1
      CopyTagsToSnapshot: true
      Tags: [{Key: Project, Value: Anonymus}]
  Server:
    Type: AWS::EC2::Instance
    DependsOn: [InternetRoute, PublicRouteAssociation]
    Properties:
      ImageId: !Ref LatestAmi
      InstanceType: t3.micro
      CreditSpecification:
        CPUCredits: standard
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref ServerSecurityGroup]
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags: [{Key: Name, Value: anonymus-backend}, {Key: Project, Value: Anonymus}]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y java-21-amazon-corretto-headless python3

Outputs:
  ServerId:
    Value: !Ref Server
  ServerPublicIp:
    Description: Puede cambiar al detener y volver a iniciar EC2. Consultar EC2 en cada sesion.
    Value: !GetAtt Server.PublicIp
  DatabaseId:
    Value: !Ref Database
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
